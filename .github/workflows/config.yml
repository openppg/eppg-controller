name: Continuous Integration
on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpplint:
    name: CPP Lint
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install cpplint
      - run: cpplint --linelength 140 --filter=-legal/copyright,-runtime/int,-build/include_subdir,-readability/casting,-readability/todo,-build/include_order,-build/include_what_you_use,-whitespace/newline --recursive ./inc/ ./lib/ ./src/

  native-tests:
    name: C++ compatibility references and device tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: simulator/ui/package-lock.json
      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libgtest-dev
      - name: Controller regressions
        run: |
          cmake -S tools/host-native-tests -B build-host-native-tests -DGTEST_DIR=/usr/src/googletest
          cmake --build build-host-native-tests --parallel
          ctest --test-dir build-host-native-tests --output-on-failure
      - name: Controller and register-level device models
        run: ./simulator/run.sh --native --test-only
      - name: Pinned CAN protocol oracle
        run: |
          cmake -S tools/host-can-protocol-probe -B build-host-can-protocol
          cmake --build build-host-can-protocol --parallel
          ./build-host-can-protocol/host_can_protocol_probe
      - name: Native production UI screenshot regressions
        run: |
          cmake -S tools/host-screenshot-offline -B build-host-screenshots -DGTEST_DIR=/usr/src/googletest
          cmake --build build-host-screenshots --parallel
          ctest --test-dir build-host-screenshots --output-on-failure
      - name: Browser lab build and live API tests
        run: |
          npm ci --prefix simulator/ui
          npm run build --prefix simulator/ui
          EPPG_SIM_BACKEND=native node --test simulator/ui/server.test.mjs
          python3 -m unittest discover -s simulator/tools -p test_qemu_smoke.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-regression-output
          path: test/test_screenshots/output/

  idf-build:
    name: C++ reference ESP32-S3 firmware
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    env:
      IDF_COMPONENT_MANAGER: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checked-out workspace inside the IDF container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build, validate and export firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -B build-idf build
          python3 tools/check_native_release.py build-idf
          mkdir -p release-artifacts
          cp build-idf/openppg_controller.bin release-artifacts/openppg-sp140-ota-firmware.bin
          cp build-idf/openppg_controller.elf release-artifacts/
          cp build-idf/openppg_controller.map release-artifacts/
          cp build-idf/partition_table/partition-table.bin release-artifacts/
          python3 simulator/tools/merge_idf_flash.py build-idf release-artifacts/openppg-sp140-full-flash.bin
      - uses: actions/upload-artifact@v7
        with:
          name: cpp-reference-esp32s3-firmware
          path: release-artifacts/

  qemu-control:
    name: C++ reference ESP32-S3 QEMU control and staging
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    env:
      IDF_COMPONENT_MANAGER: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checked-out workspace inside the IDF container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the verified Espressif QEMU release
        run: bash simulator/tools/install_qemu.sh
      - name: Execute real control tasks and verify maximum NOR staging
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          QEMU_BIN="$PWD/.tools/qemu/bin/qemu-system-xtensa" ./simulator/tools/run_qemu.sh --build --smoke
          python3 simulator/tools/qemu_smoke.py \
            --image build-idf-qemu/qemu-flash-8mb.bin --qemu .tools/qemu/bin/qemu-system-xtensa \
            --timeout 35 --send '{"emulator":{"stage_test":true}}' \
            --expect 'EPPG_QEMU_STAGE size=262144 verified=1 scratch=4096' \
            --report build-idf-qemu/qemu-max-stage.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpp-reference-ESP32-S3-QEMU-evidence
          path: build-idf-qemu/qemu-*.json

  rust-host:
    name: Production Rust controller, protocols, UI and browser API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: simulator/ui/package-lock.json
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake ninja-build g++ gdb
      - name: Pinned host Rust
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Format every Rust source, including included UI modules
        run: git ls-files -z 'rust/**/*.rs' | xargs -0 rustfmt +1.100.0 --edition 2021 --check
      - name: Production Rust tests and strict lint
        working-directory: rust
        run: |
          unset LIBCLANG_PATH
          if ! cargo +1.100.0 test --locked --workspace --exclude firmware-sp140; then
            executable=$(cargo +1.100.0 test --locked -p controller-ui --test golden --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "golden") | .executable // empty' | tail -n 1)
            if [[ -n "$executable" ]]; then
              gdb --batch -ex run -ex 'thread apply all bt' --args "$executable" --nocapture || true
            fi
            exit 1
          fi
          cargo +1.100.0 clippy --locked --workspace --exclude firmware-sp140 --all-targets -- -D warnings
          cargo +1.100.0 build --locked -p controller-sim
      - name: Check C rendering boundaries with AddressSanitizer
        working-directory: rust
        shell: bash
        run: |
          unset LIBCLANG_PATH
          export CARGO_TARGET_DIR="$PWD/target/asan"
          export CFLAGS='-fsanitize=address -fno-omit-frame-pointer'
          export RUSTFLAGS='-Clink-arg=-lasan'
          cargo +1.100.0 test --locked -p controller-ui --no-run --message-format=json > /tmp/ui-asan-executables.jsonl
          asan_runtime=$(gcc -print-file-name=libasan.so)
          test -f "$asan_runtime"
          jq -r 'select(.reason == "compiler-artifact" and .profile.test) | .executable // empty' /tmp/ui-asan-executables.jsonl > /tmp/ui-asan-executables.txt
          test -s /tmp/ui-asan-executables.txt
          while IFS= read -r executable; do
            LD_PRELOAD="$asan_runtime" ASAN_OPTIONS=detect_leaks=1 "$executable"
          done < /tmp/ui-asan-executables.txt
      - name: Browser lab build and live controller API
        working-directory: simulator/ui
        env:
          EPPG_SIM_BACKEND: rust
        run: |
          test -x ../../rust/target/debug/controller-sim
          npm ci
          npm run build
          npm test

  rust-firmware:
    name: Rust ESP32-S3 (${{ matrix.profile }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    strategy:
      fail-fast: false
      matrix:
        profile: [physical, qemu]
    env:
      IDF_COMPONENT_MANAGER: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checked-out workspace inside the IDF container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Pinned Espressif Rust toolchains
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/eppg-rustup-init.sh
          sh /tmp/eppg-rustup-init.sh -y --default-toolchain 1.100.0 --profile minimal
          . "$HOME/.cargo/env"
          cargo +1.100.0 install --locked espup --version 0.19.0
          espup install --toolchain-version 1.97.0.0 --targets esp32s3 --std --export-file "$HOME/export-esp.sh"
          cargo +1.100.0 install --locked ldproxy --version 0.3.5
      - name: Cross-build, validate and export complete firmware
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          . "$HOME/.cargo/env"
          . /opt/esp/idf/export.sh
          . "$HOME/export-esp.sh"
          if [[ "$PROFILE" = qemu ]]; then
            bash rust/tools/build.sh --qemu
          else
            bash rust/tools/build.sh
          fi
      - name: Execute Rust firmware in the ESP32-S3 emulator
        if: matrix.profile == 'qemu'
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          bash simulator/tools/install_qemu.sh
          python3 simulator/tools/qemu_smoke.py \
            --image rust/target/qemu/xtensa-esp32s3-espidf/release/images/qemu-flash.bin \
            --qemu .tools/qemu/bin/qemu-system-xtensa --timeout 30 --control-proof \
            --expect 'Rust controller boot complete' --expect 'pwm_01us=17700' \
            --expect 'Barometer initialized' --reject 'Error initializing BMP3xx' \
            --report rust/target/qemu/smoke.json
          python3 simulator/tools/qemu_smoke.py \
            --image rust/target/qemu/xtensa-esp32s3-espidf/release/images/qemu-flash.bin \
            --qemu .tools/qemu/bin/qemu-system-xtensa --timeout 35 \
            --send-after 'Rust controller boot complete' \
            --send '{"emulator":{"stage_test":true}}' \
            --expect 'Rust controller boot complete' \
            --expect 'EPPG_QEMU_STAGE size=262144 verified=1 scratch=4096' \
            --report rust/target/qemu/max-stage.json
      - name: Preserve canonical OTA and recovery artifact names
        if: matrix.profile == 'physical'
        shell: bash
        run: |
          images=rust/target/xtensa-esp32s3-espidf/release/images
          mkdir -p release-artifacts
          cp "$images/firmware.bin" release-artifacts/openppg-sp140-ota-firmware.bin
          cp "$images/recovery.bin" release-artifacts/openppg-sp140-full-flash.bin
          cp "$images/firmware.elf" release-artifacts/openppg_controller.elf
          cp "$images/firmware.map" release-artifacts/openppg_controller.map
          cp "$images/partitions.bin" "$images/release-check.json" release-artifacts/
      - uses: actions/upload-artifact@v7
        if: matrix.profile == 'physical'
        with:
          name: OpenPPG-CESP32S3-CAN-SP140-firmware
          path: release-artifacts/
      - uses: actions/upload-artifact@v7
        if: always() && matrix.profile == 'qemu'
        with:
          name: rust-esp32s3-qemu-evidence
          path: |
            rust/target/qemu/smoke.json
            rust/target/qemu/max-stage.json
            rust/target/qemu/xtensa-esp32s3-espidf/release/images/
