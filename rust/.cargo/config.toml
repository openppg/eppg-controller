[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[env]
MCU = "esp32s3"
ESP_IDF_SYS_ROOT_CRATE = "firmware-sp140"
ESP_IDF_VERSION = "v5.5.3"
ESP_IDF_SDKCONFIG_DEFAULTS = "sdkconfig.defaults"
ESP_IDF_GLOB_BASE = { value = "..", relative = true }
# Anchor source globs: an unanchored filename also matches copies in target/,
# recursively copying build output into itself on incremental builds.
ESP_IDF_GLOB_FILES = "/default_8MB.csv"
# Track local IDF shim edits so Cargo reruns IDF/CMake during incremental builds.
ESP_IDF_GLOB_COMPONENT_C = "/rust/components/**/*.c"
ESP_IDF_GLOB_COMPONENT_CMAKE = "/rust/components/**/CMakeLists.txt"
ESP_IDF_GLOB_PLATFORM_CPP = "/components/controller_platform/*.cpp"
ESP_IDF_GLOB_PLATFORM_C = "/components/controller_platform/*.c"
ESP_IDF_GLOB_STAGE_C = "/components/image_staging/*.c"
